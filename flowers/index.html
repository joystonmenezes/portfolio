<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>flowers for you 🌸</title>
<meta name="theme-color" content="#0b0620">
<meta property="og:title" content="flowers for you 🌸">
<meta property="og:description" content="a tiny garden that blooms when you tap 🌷">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  html{touch-action:manipulation}
  body{
    position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;
    background:
      radial-gradient(120% 90% at 50% -10%, #2a1660 0%, #180b3f 38%, #0b0620 75%, #060313 100%);
    font-family:Georgia,'Palatino Linotype',serif;
  }
  .blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.42;mix-blend-mode:screen;pointer-events:none;z-index:1}
  .b1{left:-25vmax;top:-18vmax;background:radial-gradient(circle,#7b2ff7 0%,transparent 62%);animation:drift1 26s ease-in-out infinite alternate}
  .b2{right:-28vmax;top:6vmax;background:radial-gradient(circle,#ff5fa2 0%,transparent 60%);animation:drift2 31s ease-in-out infinite alternate}
  .b3{left:8vmax;bottom:-34vmax;background:radial-gradient(circle,#17e0c0 0%,transparent 60%);opacity:.20;animation:drift1 37s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-8vmax,10vmax) scale(.92)}}

  .moon{position:absolute;top:8%;right:11%;width:58px;height:58px;border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 38% 34%, #fffdf2, #ffe9b0 62%, #f4cf7e 100%);
    box-shadow:0 0 42px 12px rgba(255,240,200,.28), 0 0 120px 40px rgba(255,220,170,.10);
    animation:moonf 9s ease-in-out infinite alternate}
  @keyframes moonf{to{transform:translateY(8px)}}

  .ground{position:absolute;bottom:-20vmin;left:-22%;right:-22%;height:36vmin;border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, #133c2f 0%, #0b2330 58%, transparent 75%);filter:blur(5px);opacity:.9}

  #garden{position:absolute;inset:0;z-index:2}
  .flower{position:absolute;bottom:-2px;transform:translateX(-50%);transform-origin:50% 100%;
    animation:sway var(--swd,6.5s) ease-in-out infinite;transition:opacity .7s ease;will-change:transform}
  .flower.back{filter:brightness(.86) saturate(.92);z-index:2}
  .flower.front{z-index:3}
  .flower.bye{opacity:0}
  @keyframes sway{0%,100%{transform:translateX(-50%) rotate(var(--sw,2deg))}50%{transform:translateX(-50%) rotate(calc(var(--sw,2deg) * -1))}}

  .stem{stroke-dasharray:100;stroke-dashoffset:100;animation:grow 1.15s ease-out both}
  @keyframes grow{to{stroke-dashoffset:0}}
  .leaf{opacity:0;transform-box:fill-box;transform-origin:70% 85%;transform:scale(.15) rotate(-14deg);animation:leafin .6s cubic-bezier(.25,.9,.35,1.25) both}
  @keyframes leafin{to{opacity:1;transform:scale(1) rotate(0deg)}}

  .head{position:absolute;left:50%;transform:translateX(-50%);
    filter:drop-shadow(0 0 16px var(--glow,rgba(255,120,180,.45)));
    animation:bob 5.2s ease-in-out infinite;will-change:transform}
  @keyframes bob{0%,100%{transform:translateX(-50%) rotate(2.6deg)}50%{transform:translateX(-50%) rotate(-2.6deg)}}

  .petal{position:absolute;left:50%;bottom:50%;display:block;
    transform-origin:50% 100%;
    transform:translateX(-50%) rotate(var(--r)) scale(0);
    border-radius:55% 55% 42% 42% / 74% 74% 26% 26%;
    background:radial-gradient(120% 105% at 50% 100%, var(--pa) 0%, var(--pb) 46%, var(--pc) 100%);
    box-shadow:inset 0 0 10px rgba(255,255,255,.22), inset 0 -6px 14px rgba(0,0,0,.18);
    animation:bloom .95s cubic-bezier(.2,.75,.3,1.25) both}
  .petal.in{filter:brightness(1.14) saturate(1.05)}
  @keyframes bloom{
    0%{transform:translateX(-50%) rotate(var(--r)) scale(.05)}
    70%{transform:translateX(-50%) rotate(var(--r)) scale(1.1)}
    100%{transform:translateX(-50%) rotate(var(--r)) scale(1)}}

  .core{position:absolute;left:50%;top:50%;border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    background:
      radial-gradient(circle, rgba(122,63,10,.5) 1.1px, transparent 1.6px),
      radial-gradient(circle at 40% 34%, var(--c1) 0%, #ffcf58 48%, var(--c2) 100%);
    background-size:7px 7px, cover;
    box-shadow:0 0 14px rgba(255,214,106,.55), inset 0 -4px 9px rgba(120,60,5,.45);
    animation:pop .7s cubic-bezier(.2,.85,.3,1.35) both}
  @keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}

  #fx{position:absolute;inset:0;z-index:5;pointer-events:none}

  .note{position:absolute;top:9dvh;left:0;right:0;text-align:center;z-index:6;pointer-events:none;color:#fff5fb}
  .note span{display:block;font-style:italic;font-weight:600;letter-spacing:.02em;
    font-size:clamp(27px,8vw,46px);line-height:1.22;opacity:0;
    text-shadow:0 0 22px rgba(255,120,190,.45), 0 2px 14px rgba(0,0,0,.5);
    animation:rise 1.1s ease-out forwards}
  .note .l1{animation-delay:1.5s}
  .note .l2{animation-delay:1.95s}
  .note .hint{display:block;margin-top:12px;font-style:normal;font-family:system-ui,sans-serif;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#d9c7ef;opacity:0;
    animation:rise 1.1s ease-out 2.9s forwards, pulseh 3s ease-in-out 4.2s infinite}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pulseh{0%,100%{opacity:.85}50%{opacity:.4}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;animation-delay:0s !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="moon"></div>
  <div class="ground"></div>
  <div id="garden"></div>
  <canvas id="fx"></canvas>
  <div class="note">
    <span class="l1">a little garden,</span>
    <span class="l2">just for you 🌷</span>
    <em class="hint">tap anywhere — more will bloom ✨</em>
  </div>

<script>
(function(){
  "use strict";
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd=(a,b)=>a+Math.random()*(b-a);

  const PAL=[
    {a:'#8f0f4e',b:'#ff4f9a',c:'#ffc9e2',c1:'#ffe9a8',c2:'#c77e1f',leaf:'#2f9e5f',glow:'rgba(255,99,168,.5)'},
    {a:'#b3461e',b:'#ff8a5c',c:'#ffdcc2',c1:'#fff1bd',c2:'#c9821c',leaf:'#379a58',glow:'rgba(255,150,100,.5)'},
    {a:'#4d21a8',b:'#a06bff',c:'#e6d6ff',c1:'#ffe9a8',c2:'#b8791d',leaf:'#2c9068',glow:'rgba(165,120,255,.5)'},
    {a:'#96128a',b:'#ff4fd8',c:'#ffd0f4',c1:'#fff0b8',c2:'#c07a19',leaf:'#31a163',glow:'rgba(255,110,225,.5)'},
    {a:'#a86a12',b:'#ffb347',c:'#ffe9b8',c1:'#fff6d8',c2:'#a5620e',leaf:'#3a9a52',glow:'rgba(255,200,110,.5)'}
  ];

  const garden=document.getElementById('garden');
  const flowers=[];

  function makeFlower(xPct, delay){
    const minD=Math.min(innerWidth,innerHeight);
    const head=Math.min(150,Math.max(62,minD*rnd(.165,.235)));
    const stemH=Math.min(innerHeight*.44, head*rnd(1.55,2.15));
    const pal=PAL[(Math.random()*PAL.length)|0];
    const f=document.createElement('div');
    f.className='flower '+(head<minD*.19?'back':'front');
    f.style.cssText='left:'+xPct+'%;width:'+head+'px;height:'+stemH+'px;'+
      '--sw:'+rnd(1.4,3.1).toFixed(2)+'deg;--swd:'+rnd(5,8.5).toFixed(2)+'s;'+
      'animation-delay:-'+rnd(0,8).toFixed(2)+'s;bottom:'+rnd(-4,14).toFixed(0)+'px';
    f.innerHTML='<svg viewBox="0 0 60 160" preserveAspectRatio="none" style="position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible">'+
      '<path class="stem" d="M30 160 C30 128 22 112 27 84 C31 62 30 44 30 20" fill="none" stroke="'+pal.leaf+'" stroke-width="3.4" vector-effect="non-scaling-stroke" stroke-linecap="round" pathLength="100" style="animation-delay:'+delay+'s"/>'+
      '<path class="leaf" d="M28 118 C16 114 8 102 7 90 C20 93 27 102 29 112 Z" fill="'+pal.leaf+'" style="animation-delay:'+(delay+.55)+'s"/>'+
      '<path class="leaf" d="M31 96 C43 92 51 80 52 68 C39 71 32 80 30 90 Z" fill="'+pal.leaf+'" style="animation-delay:'+(delay+.72)+'s"/></svg>';
    const h=document.createElement('div');
    h.className='head';
    h.style.cssText='width:'+head+'px;height:'+head+'px;top:'+(stemH*.125-head/2)+'px;--glow:'+pal.glow+';animation-delay:-'+rnd(0,5).toFixed(2)+'s';
    const outer=10, inner=7;
    for(let i=0;i<outer;i++){
      const p=document.createElement('i');p.className='petal';
      p.style.cssText='--r:'+(i*360/outer+rnd(-5,5)).toFixed(1)+'deg;--pa:'+pal.a+';--pb:'+pal.b+';--pc:'+pal.c+
        ';width:'+(head*.30)+'px;height:'+(head*.50)+'px;animation-delay:'+(delay+.85+i*.045).toFixed(2)+'s';
      h.appendChild(p);
    }
    for(let i=0;i<inner;i++){
      const p=document.createElement('i');p.className='petal in';
      p.style.cssText='--r:'+(i*360/inner+18).toFixed(1)+'deg;--pa:'+pal.a+';--pb:'+pal.b+';--pc:'+pal.c+
        ';width:'+(head*.215)+'px;height:'+(head*.36)+'px;animation-delay:'+(delay+1.18+i*.05).toFixed(2)+'s';
      h.appendChild(p);
    }
    const core=document.createElement('b');core.className='core';
    core.style.cssText='width:'+(head*.3)+'px;height:'+(head*.3)+'px;--c1:'+pal.c1+';--c2:'+pal.c2+';animation-delay:'+(delay+1.4)+'s';
    h.appendChild(core);
    f.appendChild(h);
    garden.appendChild(f);
    flowers.push(f);
    if(flowers.length>14){const old=flowers.shift();old.classList.add('bye');setTimeout(()=>old.remove(),800);}
  }

  // first bloom
  const spots=[12,30,50,70,88].map(x=>x+rnd(-4,4));
  const delays=[.15,.55,.95,1.35,1.7];
  spots.forEach((x,i)=>makeFlower(x,delays[i]));

  // ---- canvas: stars, falling petals, fireflies, tap sparks ----
  const cv=document.getElementById('fx'),cx=cv.getContext('2d');
  let W,H,DPR;
  function fit(){DPR=Math.min(2,devicePixelRatio||1);
    cv.width=W=Math.floor(innerWidth*DPR);cv.height=H=Math.floor(innerHeight*DPR);
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
  addEventListener('resize',fit);fit();

  const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.55,r:rnd(.4,1.4),tw:rnd(0,6.28),ts:rnd(.5,1.6)}));
  const PCOL=['255,143,192','255,179,214','201,166,255','255,201,163','255,154,223'];
  const fall=Array.from({length:16},()=>({x:Math.random(),y:Math.random(),s:rnd(4.5,11),a:rnd(0,6.28),va:rnd(-.018,.018),vy:rnd(.00045,.001),ph:rnd(0,6.28),c:PCOL[(Math.random()*PCOL.length)|0]}));
  const FCOL=['255,233,160','183,255,224','255,214,235'];
  const flies=Array.from({length:13},()=>({x:Math.random(),y:rnd(.15,.95),t:rnd(0,100),c:FCOL[(Math.random()*FCOL.length)|0]}));
  const sparks=[];

  function draw(t){
    cx.clearRect(0,0,W,H);
    // stars
    for(const s of stars){
      cx.globalAlpha=.32+.34*Math.sin(t*.001*s.ts+s.tw);
      cx.fillStyle='#fff';
      cx.beginPath();cx.arc(s.x*W,s.y*H,s.r*DPR,0,7);cx.fill();
    }
    cx.globalAlpha=1;
    // falling petals
    for(const p of fall){
      p.y+=p.vy; p.a+=p.va;
      const px=(p.x+.05*Math.sin(t*.0005+p.ph)+1)%1;
      if(p.y>1.06){p.y=-.06;p.x=Math.random();}
      cx.save();cx.translate(px*W,p.y*H);cx.rotate(p.a);cx.scale(1,.55);
      cx.fillStyle='rgba('+p.c+',.8)';
      cx.beginPath();cx.arc(0,0,p.s*DPR,0,7);cx.fill();cx.restore();
    }
    // fireflies
    cx.globalCompositeOperation='lighter';
    for(const f of flies){
      f.x=(f.x+.00035*Math.sin(t*.00032+f.t)+1)%1;
      f.y=(f.y-.00022+1)%1;
      const r=(1.6+Math.sin(t*.004+f.t)*.8)*DPR;
      cx.shadowBlur=15*DPR;cx.shadowColor='rgb('+f.c+')';
      cx.fillStyle='rgba('+f.c+',.9)';
      cx.beginPath();cx.arc(f.x*W,f.y*H,Math.max(.4,r),0,7);cx.fill();
    }
    cx.shadowBlur=0;
    // tap sparks
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];
      s.x+=s.vx;s.y+=s.vy;s.vy+=.05*DPR;s.vx*=.96;s.life-=.028;
      if(s.life<=0){sparks.splice(i,1);continue;}
      cx.globalAlpha=Math.max(0,s.life);
      cx.shadowBlur=10*DPR;cx.shadowColor='rgb('+s.c+')';
      cx.fillStyle='rgba('+s.c+',.95)';
      cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();
    }
    cx.globalAlpha=1;cx.shadowBlur=0;
    cx.globalCompositeOperation='source-over';
    if(!reduced)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---- tap to bloom ----
  let tapped=false;
  addEventListener('pointerdown',e=>{
    const x=Math.max(6,Math.min(94,e.clientX/innerWidth*100));
    makeFlower(x,0);
    for(let i=0;i<12;i++){
      const an=rnd(0,6.28),sp=rnd(1,3.4)*DPR;
      sparks.push({x:e.clientX*DPR,y:e.clientY*DPR,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-1.2*DPR,r:rnd(1,2.6)*DPR,life:1,c:['255,220,130','255,150,200','200,170,255'][(Math.random()*3)|0]});
    }
    if(!tapped){tapped=true;const h=document.querySelector('.hint');if(h)h.style.opacity=.25,h.style.animation='none';}
  });
})();
</script>
</body>
</html>
